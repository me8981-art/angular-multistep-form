services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_inquiry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_inquiry"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/ProjectInquiry.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=project_inquiry;Username=postgres;Password=postgres
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
